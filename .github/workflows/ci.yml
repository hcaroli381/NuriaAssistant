name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java:
    name: Java build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run tests
        run: ./mvnw -B test

  python:
    name: Voice backend compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile backend
        run: python -m py_compile voice-backend/main.py
